<style>

    --popover: oklch(0.205 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --warning: oklch(0.3 0.06 70);
    --warning-foreground: oklch(0.85 0.12 85);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --sidebar: oklch(0.205 0 0);

  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --popover: oklch(0.205 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --secondary-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --warning: oklch(0.3 0.06 70);
  --warning-foreground: oklch(0.85 0.12 85);

  --input: oklch(1 0 0 / 15%);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
@media (max-width: 700px) { .rbar { position: static; } }
body { background: var(--canvas); color: var(--foreground); font-family: var(--font-sans); }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Review chrome ---------- */
.rbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100; background: color-mix(in oklch, var(--canvas) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding-block: 12px; padding-inline: 16px; display: flex; flex-direction: column; gap: 10px; }
.rrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.rtitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.rtitle h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.rtitle span { font-size: 12.5px; color: var(--muted-foreground); }
.rctl { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--radius); background: color-mix(in oklch, var(--foreground) 7%, transparent); }
.seg button { border: 0; background: none; height: 28px; padding-inline: 10px; border-radius: calc(var(--radius) * 0.8); font-size: 12.5px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 0 0 1px var(--border), 0 1px 2px oklch(0 0 0 / 0.06); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 1px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 28px; padding-inline: 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.chip.prop::after { content: " · proposed"; opacity: 0.6; }
.stage { padding-block: 20px; padding-inline: 16px; overflow-x: auto; }
.fw { position: relative; margin-inline: auto; }
.device { position: absolute; top: 0; left: 0; transform-origin: 0 0; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), 0 12px 40px oklch(0 0 0 / 0.10); background: var(--background); color: var(--foreground); }
.device.phone { border-radius: 40px; box-shadow: 0 0 0 7px var(--bezel), 0 0 0 8px var(--border), 0 16px 40px oklch(0 0 0 / 0.18); }
.notes { max-width: 1240px; margin-inline: auto; padding-inline: 16px; padding-block: 4px 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 24px; }
.notes section { min-width: 0; }
.notes h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); margin: 0 0 8px; }
.notes p, .notes li { font-size: 13.5px; line-height: 1.55; margin: 0; max-width: 62ch; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes .lede { font-size: 15px; font-weight: 500; line-height: 1.45; margin-bottom: 6px; }
.notes code { font-family: var(--font-mono); font-size: 12px; background: color-mix(in oklch, var(--foreground) 7%, transparent); padding: 1px 5px; border-radius: 5px; }
.notes .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warning); color: var(--warning-foreground); margin-left: 6px; vertical-align: 1px; }

/* ---------- App (mock of stock shadcn base-nova components) ---------- */
.app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--background); color: var(--foreground); font: 400 14px/1.43 var(--font-sans); -webkit-font-smoothing: antialiased; }
.app svg.lucide { width: 16px; height: 16px; flex: none; }
.app .i14 svg.lucide, .app svg.lucide.i14 { width: 14px; height: 14px; }
.app svg.i12 { width: 12px !important; height: 12px !important; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted-foreground); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tab { font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding-inline: 10px; border-radius: var(--radius); border: 1px solid transparent; background: none; color: inherit; font: 500 14px/1 var(--font-sans); white-space: nowrap; cursor: pointer; text-decoration: none; }
.btn.sm { height: 28px; padding-inline: 8px; font-size: 13px; border-radius: calc(var(--radius) * 0.8); }
.btn.lg { height: 36px; }
.btn.icon { width: 32px; padding: 0; }
.btn.icon.sm { width: 28px; }
.btn.primary { background: var(--primary); color: var(--primary-foreground); }
.btn.primary:hover { background: color-mix(in oklch, var(--primary) 85%, transparent); }
.btn.outline { border-color: var(--border); background: var(--background); }
.btn.outline:hover, .btn.ghost:hover { background: var(--muted); }
.btn.dashed { border-style: dashed; }
.btn.secondary { background: var(--secondary); color: var(--secondary-foreground); }
.btn.block { width: 100%; }
.btn .bdg { height: 20px; padding-inline: 5px; border-radius: 4px; background: var(--secondary); font-size: 12px; font-weight: 400; display: inline-flex; align-items: center; }
.btn .vsep { width: 1px; height: 16px; background: var(--border); margin-inline: 2px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding-inline: 8px; border-radius: 999px; border: 1px solid transparent; font-size: 12px; font-weight: 500; white-space: nowrap; line-height: 1; }
.badge svg.lucide { width: 12px; height: 12px; }
.badge.secondary { background: var(--secondary); color: var(--secondary-foreground); }
.badge.outline { border-color: var(--border); }
.badge.destructive { background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); }
.badge.warning { background: var(--warning); color: var(--warning-foreground); }
.badge.x { padding-right: 4px; cursor: pointer; }
.badge.x:hover { background: var(--muted); }
.dot { width: 6px; height: 6px; border-radius: 99px; background: var(--muted-foreground); }
.kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding-inline: 4px; border-radius: 4px; background: var(--muted); color: var(--muted-foreground); font-size: 11px; font-weight: 500; }
.ig { display: flex; align-items: center; gap: 6px; height: 32px; padding-inline: 8px; border: 1px solid var(--input); border-radius: var(--radius); color: var(--muted-foreground); background: transparent; min-width: 0; }
.ig input { flex: 1; min-width: 0; width: 0; border: 0; outline: 0; background: none; color: var(--foreground); font: 400 14px var(--font-sans); }
.ig input::placeholder { color: var(--muted-foreground); }
.ig.err { border-color: var(--destructive); box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 20%, transparent); }
.sep-v { width: 1px; height: 16px; background: var(--border); flex: none; }
.hr { height: 1px; background: var(--border); }
.card { background: var(--card); border-radius: calc(var(--radius) * 1.4); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent); display: flex; flex-direction: column; gap: 16px; padding-block: 16px; min-width: 0; }
.card-h { padding-inline: 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: start; }
.card-t { font-size: 15px; font-weight: 500; }
.card-d { font-size: 13px; color: var(--muted-foreground); grid-column: 1; }
.card-a { grid-column: 2; grid-row: 1 / span 2; }
.card-c { padding-inline: 16px; }
.card-f { margin-bottom: -16px; padding: 10px 16px; border-top: 1px solid var(--border); background: color-mix(in oklch, var(--muted) 50%, transparent); display: flex; align-items: center; gap: 8px; border-radius: 0 0 calc(var(--radius) * 1.4) calc(var(--radius) * 1.4); }
.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: start; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; }
.alert svg.lucide { margin-top: 2px; }
.alert b { font-weight: 500; }
.alert.warn { background: var(--warning); color: var(--warning-foreground); border-color: color-mix(in oklch, var(--warning-foreground) 25%, transparent); }
.alert.bad { color: var(--destructive); background: var(--card); }
.alert .a-d { grid-column: 2; color: inherit; opacity: 0.9; }
.alert .a-x { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px 24px; text-wrap: balance; }
.empty .media { width: 36px; height: 36px; border-radius: var(--radius); background: var(--muted); display: grid; place-items: center; }
.empty h3 { margin: 0; font-size: 14px; font-weight: 500; }
.empty p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted-foreground); max-width: 46ch; }
.empty .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.code { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding-inline: 10px 4px; border-radius: var(--radius); background: var(--muted); font: 400 12.5px var(--font-mono); color: var(--foreground); }
.skel { background: var(--muted); border-radius: 6px; height: 12px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.spin { animation: spin 1s linear infinite; color: var(--muted-foreground); }
@keyframes spin { to { transform: rotate(360deg); } }
.check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--input); display: inline-grid; place-items: center; flex: none; background: var(--background); }
.check.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
.check.on svg.lucide { width: 12px; height: 12px; stroke-width: 3; }
.radio { width: 16px; height: 16px; border-radius: 99px; border: 1px solid var(--input); flex: none; display: inline-grid; place-items: center; }
.radio.on::after { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--primary); }
.progress { height: 6px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }

/* Shell: sidebar-07 (collapsible="icon") + SidebarInset */
.shell { display: flex; height: 100%; }
.sb { width: 256px; flex: none; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; padding: 8px; gap: 8px; transition: width 0.2s; }
.collapsed .sb { width: 48px; }
.sb-brand { display: flex; align-items: center; gap: 8px; height: 48px; padding: 8px; border-radius: var(--radius); }
.logo { width: 32px; height: 32px; border-radius: var(--radius); background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; flex: none; }
.collapsed .sb-brand { padding: 0; justify-content: center; }
.sb-text { display: grid; line-height: 1.2; min-width: 0; }
.sb-text b { font-size: 14px; font-weight: 600; }
.sb-text small { font-size: 12px; color: var(--muted-foreground); }
.collapsed .sb-text, .collapsed .sb-label, .collapsed .nav span, .collapsed .nav .nbdg { display: none; }
.sb-label { font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 0 8px; height: 32px; display: flex; align-items: center; }
.nav { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: calc(var(--radius) * 0.8); cursor: pointer; font-size: 14px; color: var(--foreground); border: 0; background: none; width: 100%; text-align: left; }
.nav:hover, .nav.on { background: var(--sidebar-accent); }
.nav.on { font-weight: 500; }
.collapsed .nav { width: 32px; justify-content: center; padding: 0; }
.nbdg { margin-left: auto; font-size: 12px; font-weight: 500; min-width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: var(--destructive); }
.inset { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.hd { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding-inline: 12px 16px; border-bottom: 1px solid var(--border); }
.crumb { font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.crumb .muted { white-space: nowrap; }
.hd-r { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* Auctions page */
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tb { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; flex-wrap: wrap; }
.pa { position: relative; }
.fbar { display: flex; align-items: center; gap: 6px; padding: 0 16px 10px; flex-wrap: wrap; }
.fbar .lbl { font-size: 12.5px; color: var(--muted-foreground); margin-right: 2px; }
.box { margin: 0 16px; flex: 1; min-height: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; position: relative; }
.pg { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 12px; font-size: 13px; flex-wrap: wrap; }
.pg .ctl { display: flex; align-items: center; gap: 6px; }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; color: inherit; font-family: inherit; }
.t th { position: sticky; top: 0; z-index: 2; background: var(--background); height: 36px; padding: 0 8px; text-align: left; font-weight: 500; white-space: nowrap; border-bottom: 1px solid var(--border); }
.t thead tr.grp th { height: 26px; font-size: 11.5px; font-weight: 500; color: var(--muted-foreground); text-align: center; border-bottom: 1px solid var(--border); }
.t thead tr.grp th.gl { border-left: 1px solid var(--border); }
.t thead tr.col th { top: 26px; }
.t th.rs { top: 0 !important; }
.t th .sh { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; margin-inline: -4px; border-radius: 6px; cursor: pointer; }
.t th .sh:hover { background: var(--muted); }
.t th.num .sh { flex-direction: row; }
.t th .sh svg.lucide { width: 13px; height: 13px; color: var(--muted-foreground); }
.t th .sh.on svg.lucide { color: var(--foreground); }
.t th .gl, .t td.gl { border-left: 1px solid var(--border); }
.t td { height: 40px; padding: 0 8px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--background); }
.t tbody tr:hover td, .t tbody tr.rsel td { background: color-mix(in oklch, var(--muted) 70%, var(--background)); }
.t tbody tr:last-child td { border-bottom: 0; }
.t .c0 { position: sticky; left: 0; z-index: 1; }
.t th.c0 { z-index: 3; }
.t a.dn { color: var(--foreground); text-decoration: none; font-family: var(--font-mono); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.t a.dn:hover { text-decoration: underline; text-underline-offset: 3px; }
.t a.dn svg.lucide { width: 12px; height: 12px; color: var(--muted-foreground); }
.t .gattr { color: var(--muted-foreground); text-decoration: none; font-size: 11px; line-height: 1.15; display: inline-block; }
.t .gattr:hover { text-decoration: underline; color: var(--foreground); }
.urg-amber { color: var(--warning-foreground); font-weight: 500; }
.urg-red { color: var(--destructive); font-weight: 600; }
.abs { color: var(--muted-foreground); font-size: 12px; margin-left: 6px; }
.t .rowbtn { opacity: 0.55; }
.t tr:hover .rowbtn, .t tr.rsel .rowbtn { opacity: 1; }

/* Overlays: Popover + Command, Sheet, Drawer */
.pop { position: absolute; top: 36px; left: 0; z-index: 50; width: 232px; background: var(--popover); border-radius: var(--radius); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent), 0 8px 24px oklch(0 0 0 / 0.12); padding: 4px; font-size: 13.5px; }
.cmd-in { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border-bottom: 1px solid var(--border); margin: -4px -4px 4px; color: var(--muted-foreground); }
.cmd-in span { color: var(--foreground); }
.opt { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; }
.opt:hover, .opt.hl { background: var(--accent); }

.pop .foot { border-top: 1px solid var(--border); margin: 4px -4px -4px; padding: 4px; }
.pop .foot .opt { justify-content: center; }
.grp-l { font-size: 12px; color: var(--muted-foreground); padding: 6px 8px 2px; }
.scrim { position: absolute; inset: 0; z-index: 60; background: var(--scrim); backdrop-filter: blur(2px); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; z-index: 61; width: 440px; max-width: 100%; background: var(--background); border-left: 1px solid var(--border); box-shadow: -12px 0 32px oklch(0 0 0 / 0.08); display: flex; flex-direction: column; }
.sheet.left { left: 0; right: auto; width: 288px; border-left: 0; border-right: 1px solid var(--border); }
.sh-h { padding: 16px; display: grid; gap: 4px; position: relative; }
.sh-h h2 { margin: 0; font-size: 16px; font-weight: 500; }
.sh-h p { margin: 0; font-size: 13px; color: var(--muted-foreground); }
.sh-x { position: absolute; top: 10px; right: 10px; }

  return `<span class="badge outline" title="Last successful sync Oct 6, 15:33 UTC"><span class="dot"></span>Synced 11h ago</span>`;
}

/* ---------- shared pieces ---------- */
function facet(label, sel, act, open) {
  const s = sel && sel.length ? `<span class="vsep"></span>${sel.length > 2 ? `<span class="bdg">${sel.length} selected</span>` : sel.map(v => `<span class="bdg">${v}</span>`).join('')}` : '';
  return `<div class="pa"><button class="btn outline sm dashed" data-act="${act}" aria-expanded="${!!open}">${ic('circle-plus')}${label}${s}</button>${open || ''}</div>`;
}
function tldPopover() {
  const opts = [['.com', true], ['.co', false], ['.coffee', false], ['.college', false], ['.cool', false], ['.coach', false]];
  return `<div class="pop" role="dialog" aria-label="TLD">
    <div class="cmd-in">${ic('search')}<span>co</span><span class="kbd" style="margin-left:auto">esc</span></div>
    ${opts.map(([t, on], i) => `<div class="opt ${i === 0 ? 'hl' : ''}"><span class="check ${on ? 'on' : ''}">${on ? ic('check') : ''}</span><span class="mono">${t}</span></div>`).join('')}
    <div class="grp-l">478 TLDs in the inventory</div>
    <div class="foot"><div class="opt" data-act="chip:results">Clear filter</div></div>
  </div>`;
}
function columnsMenu() {
  const item = (c) => `<div class="mi" role="menuitemcheckbox" aria-checked="${S.cols.has(c.k)}" data-act="col:${c.k}"><span class="ck">${S.cols.has(c.k) ? ic('check') : ''}</span>${c.full ? `${c.full}` : c.l}${c.grp ? `<span class="r">${c.grp}</span>` : c.def ? '' : '<span class="r">Off by default</span>'}</div>`;
  return `<div class="menu" role="menu" aria-label="Columns">
    <div class="ml">Listing</div>
    <div class="mi dis" aria-disabled="true"><span class="ck">${ic('check')}</span>Domain<span class="r">Always shown</span></div>
    ${COLS.filter(c => !c.grp).map(item).join('')}
    <div class="msep"></div><div class="ml">SEO metrics</div>
    ${COLS.filter(c => c.grp).map(item).join('')}
    <div class="msep"></div>
    <div class="mi" data-act="colreset"><span class="ck">${ic('rotate-ccw')}</span>Reset to default</div>

}
function toolbar(x) {

    ${facet('TLD', f ? ['.com', '.co'] : nm ? ['.io'] : S.chip === 'tld' ? ['.com'] : null, 'chip:tld', S.chip === 'tld' ? tldPopover() : '')}

    ${facet('Ends', nm ? ['1 hour'] : null, 'chip:results')}
    <button class="btn outline sm" data-act="chip:more">${ic('list-filter')}All filters${f ? '<span class="bdg">2</span>' : nm ? '<span class="bdg">1</span>' : ''}</button>

function filterBar() {

}
function sortHead(key, label) {
  const on = S.sort.key === key;
  const icn = on ? (S.sort.dir === 'asc' ? 'arrow-up' : 'arrow-down') : 'chevrons-up-down';
  return `<span class="sh ${on ? 'on' : ''}" data-act="sort:${key}" role="button" aria-label="Sort by ${label}">${label}${ic(icn)}</span>`;
}
function drCell(r, x) {
  if (x.ratings && r.dr !== 'none') return `<span title="Fetching from Ahrefs">${ic('loader-circle', 'spin i14')}</span>`;
  if (r.dr === 'none') return `<span class="muted" title="Ahrefs has no rating for this domain">—</span>`;
  return r.dr;
}
function table(x) {
  X = x;
  const sel = S.chip === 'details' ? S.detail : null;
  const vis = COLS.filter(c => S.cols.has(c.k));
  const lst = vis.filter(c => !c.grp);
  const groups = ['Majestic', 'Semrush', 'Ahrefs'].map(g => [g, vis.filter(c => c.grp === g)]).filter(([, a]) => a.length);
  const ordered = [...lst, ...groups.flatMap(([, a]) => a)];
  const firstOfGroup = new Set(groups.map(([, a]) => a[0].k));
  const top = 'color:var(--foreground);font-size:13px;';
  const glabel = (g) => g === 'Ahrefs' ? `<a class="gattr" href="https://ahrefs.com/" target="_blank" rel="noopener noreferrer">Domain Rating<br>by Ahrefs</a>` : g;
  const head = `<thead>
    <tr class="grp">
      <th class="c0 rs" rowspan="2" style="text-align:left;${top}height:62px;width:220px">${sortHead('domain', 'Domain')}</th>
      ${lst.map(c => `<th class="rs ${c.num ? 'num' : ''}" rowspan="2" style="${c.num ? '' : 'text-align:left;'}${top}">${sortHead(c.sort, c.l)}</th>`).join('')}
      ${groups.map(([g, a]) => `<th class="gl" colspan="${a.length}" style="${g === 'Ahrefs' ? 'padding:0 6px' : ''}">${glabel(g)}</th>`).join('')}
      <th class="rs" rowspan="2" style="width:40px"><span class="sr">Details</span></th>
    </tr>
    <tr class="col">${groups.flatMap(([, a]) => a).map(c => `<th class="num ${firstOfGroup.has(c.k) ? 'gl' : ''}" title="${c.grp} ${c.full}">${c.l}</th>`).join('')}</tr>
  </thead>`;
  let body;
  if (x.loading) {
    body = Array.from({ length: 16 }, (_, i) => `<tr><td class="c0"><div class="skel" style="width:${150 - (i * 7) % 40}px"></div></td>${ordered.map((c, j) => `<td class="${firstOfGroup.has(c.k) ? 'gl' : ''}"><div class="skel" style="width:${(c.k === 'ends' ? 120 : c.k === 'source' ? 90 : c.grp ? 18 : 44) - (i * 7 + j * 5) % 14}px;${c.num ? 'margin-left:auto' : ''}"></div></td>`).join('')}<td></td></tr>`).join('');
  } else {
    body = x.rows.map(r => `<tr class="${sel === r.d ? 'rsel' : ''}">
      <td class="c0"><a class="dn" href="#" title="Open the ${r.src} auction in a new tab">${r.d}${ic('external-link')}</a></td>
      ${ordered.map(c => `<td class="${c.num ? 'num' : 'tab'} ${firstOfGroup.has(c.k) ? 'gl' : ''}">${c.cell(r)}</td>`).join('')}
      <td style="padding:0 4px"><button class="btn ghost icon sm rowbtn" data-act="detail:${r.d}" aria-label="Details for ${r.d}">${ic('panel-right-open')}</button></td>
    </tr>`).join('');
  }
  return `<table class="t">${head}<tbody>${body}</tbody></table>`;
}
function pagination(x, phone) {
  if (x.loading) return `<div class="pg"><span class="skel" style="width:160px"></span><span class="skel" style="width:220px"></span></div>`;
  const first = x.total ? 1 : 0, last = Math.min(50, x.total);
  const dis = 'disabled style="opacity:.5"';
  if (phone) return `<div class="pg" style="justify-content:center;gap:8px"><button class="btn outline sm" ${dis}>${ic('chevron-left')}Prev</button><span class="tab muted" style="min-width:110px;text-align:center">Page 1 of ${nf(x.pages)}</span><button class="btn outline sm" ${x.pages === 1 ? dis : ''}>Next${ic('chevron-right')}</button></div>`;
  return `<div class="pg"><span class="muted tab">Showing ${first}–${last} of ${nf(x.total)}</span>
    <div class="ctl"><span class="tab" style="margin-right:6px">Page 1 of ${nf(x.pages)}</span>
      <button class="btn outline icon sm" ${dis} aria-label="First page">${ic('chevrons-left')}</button>
      <button class="btn outline icon sm" ${dis} aria-label="Previous page">${ic('chevron-left')}</button>

}
function staleAlert(phone) {
  return `<div class="alert warn" role="status" style="margin:${phone ? '12px 16px 0' : '0 16px 10px'}">${ic('triangle-alert')}<b>The inventory is 26 hours old</b><span class="a-d">Ended auctions are hidden, but prices, bids, and new listings may be out of date until the next sync.</span><button class="btn outline sm a-x" data-act="screen:sync" style="${phone ? 'display:none' : ''}">Sync status</button></div>`;

function emptyState(kind) {
  if (kind === 'nomatch') return `<div class="empty"><div class="media">${ic('search-x')}</div><div><h3>No listings match these filters</h3><p>Nothing in the active inventory meets all 4 filters. Remove one, or clear them all to see every listing.</p></div><div class="acts"><button class="btn outline sm" data-act="chip:results">Clear all filters</button><button class="btn ghost sm" data-act="chip:more">Edit filters</button></div></div>`;
  if (kind === 'noinv') return `<div class="empty"><div class="media">${ic('database')}</div><div><h3>No auctions collected yet</h3><p>Run a sync to load listings into the local database. GoDaddy needs no credentials and takes about 3 minutes.</p></div><div class="acts"><span class="code">corepack pnpm sync godaddy<button class="btn ghost icon sm" aria-label="Copy command">${ic('copy')}</button></span></div><button class="btn ghost sm" data-act="screen:sync">View sync status${ic('arrow-right')}</button></div>`;
  return `<div class="empty"><div class="media" style="color:var(--destructive)">${ic('circle-alert')}</div><div><h3>The inventory couldn’t be read</h3><p>The local database didn’t respond. Apply migrations, then try again.</p></div><div class="acts"><span class="code">corepack pnpm db:migrate:local<button class="btn ghost icon sm" aria-label="Copy command">${ic('copy')}</button></span></div><button class="btn outline sm" data-act="chip:results">${ic('rotate-cw')}Try again</button></div>`;
}

/* ---------- Filters page ---------- */
function filterSections(inv) {
  const input = (id, ph, val, err, pre) => `<label class="ig ${err ? 'err' : ''}">${pre ? `<span>${pre}</span>` : ''}<input id="${id}" placeholder="${ph}" ${val ? `value="${val}"` : ''} ${err ? 'aria-invalid="true"' : ''}></label>`;
  const single = (id, label, ph, val, pre, cls = '') => `<div class="field ${cls}"><label for="${id}">${label}</label>${input(id, ph, val, false, pre)}</div>`;
  const range = (id, label, pre, vals = ['', ''], err) => `<div class="field"><span class="flabel">${label}</span><div class="range">${input(id + 'min', 'Min', vals[0], !!err, pre)}<span class="muted">–</span>${input(id + 'max', 'Max', vals[1], !!err, pre)}</div>${err ? `<span class="err">${err}</span>` : ''}</div>`;
  const checks = (label, items, cls = '') => `<div class="field ${cls}"><span class="flabel">${label}</span><div class="chkrow">${items.map(([t, on]) => `<span class="chk"><span class="check ${on ? 'on' : ''}">${on ? ic('check') : ''}</span>${t}</span>`).join('')}</div></div>`;
  const toggle = (label, opts, on, cls = '') => `<div class="field ${cls}"><span class="flabel">${label}</span><div class="tgl">${opts.map(o => `<span class="${o === on ? 'on' : ''}">${o}</span>`).join('')}</div></div>`;
  return [
    { id: 'general', t: 'General', d: 'The same filters as the toolbar.', n: 1, f: `
      ${single('q', 'Domain contains', 'e.g. garden', '', '', 'span2')}
      ${checks('Source', [['GoDaddy', false], ['Dynadot', false]])}
      <div class="field span2"><span class="flabel">TLD</span><label class="ig" style="height:auto;min-height:32px;padding:4px 8px;flex-wrap:wrap"><span class="badge secondary">.com ${ic('x')}</span><span class="badge secondary">.co ${ic('x')}</span><input placeholder="Search 478 TLDs…" style="min-width:120px"></label></div>
      ${single('pmax0', 'Max current bid', 'Any', '', '$')}
      ${toggle('Ends within', ['Any time', '1 hour', '6 hours', '24 hours', '3 days', '7 days'], 'Any time', 'span3')}` },
    { id: 'auction', t: 'Auction', d: 'Auction type and price.', n: 0, f: `
      ${checks('Auction type', [['Auction', false], ['Buy Now', false], ['Expired', false]])}
      ${range('price', 'Current bid', '$')}
      ${single('ren', 'Max renewal price', 'Any', '', '$')}` },
    { id: 'name', t: 'Name', d: 'Shape and age of the domain name. Length counts the whole name, TLD included.', n: inv ? 2 : 1, f: `
      ${range('len', 'Length (characters)', '', inv ? ['14', '8'] : ['', ''], inv ? 'Minimum length can’t be more than maximum length.' : '')}
      ${range('age', 'Age (years)', '')}
      ${checks('Characters', [['No hyphens', false], ['No digits', true]])}` },
    { id: 'activity', t: 'Activity and value', d: 'Unknown values stay eligible until you set a limit.', n: 1, f: `
      ${single('bmin', 'Min bids', 'Any', '5')}
      ${single('vmin', 'Min visitors', 'Any')}
      ${single('lmin', 'Min inbound links', 'Any')}
      ${single('amin', 'Min appraisal', 'Any', '', '$')}` },
    { id: 'seo', t: 'SEO metrics', d: 'Domains without a value are excluded once you set a minimum. Majestic and Semrush values come from GoDaddy’s feed.', n: 0, f: `
      ${single('tf', 'Min Majestic Trust Flow', '0–100')}
      ${single('cf', 'Min Majestic Citation Flow', '0–100')}
      ${single('rd', 'Min Majestic referring domains', 'Any')}
      ${single('as', 'Min Semrush Authority Score', '0–100')}` }
  ];
}
function filtersPage(phone) {

/* ---------- desktop screens ---------- */

function auctionsDesktop() {
  if (S.chip === 'more' || S.chip === 'invalid') return shell(filtersPage(false), `<span class="muted" data-act="chip:filtered" style="cursor:pointer">Auctions</span>${ic('chevron-right', 'i14 muted')}<span>Filters</span>`, freshBadge('ok'), '');
  const x = ctx();
  let region;
  if (x.error) region = `<div class="box" style="display:grid;place-items:center">${emptyState('error')}</div>`;
  else if (S.chip === 'noinv') region = `<div class="box" style="display:grid;place-items:center">${emptyState('noinv')}</div>`;
  else if (S.chip === 'nomatch') region = `<div class="box">${table(x).replace(/<tbody>[\s\S]*<\/tbody>/, '<tbody></tbody>')}<div style="display:grid;place-items:center;min-height:420px">${emptyState('nomatch')}</div></div>`;
  else region = `<div class="box">${table(x)}</div>`;
  const main = `<div class="page">${toolbar(x)}${filterBar()}${S.chip === 'stale' ? staleAlert() : ''}${region}${x.error || S.chip === 'noinv' ? '<div style="height:16px"></div>' : pagination(x)}</div>`;
